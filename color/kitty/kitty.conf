term xterm-kitty
# 禁用Kitty Shell Integration光标形状控制的功能 no-cursor no-title disabled
shell_integration no-cursor
# 允许其他程序控制kitty
allow_remote_control yes
# 开启垂直同步
sync_to_monitor yes
dynamic_background_opacity yes
auto_reload_config 0.5

background_opacity 1

cursor_shape block
cursor_beam_thickness 1
cursor_blink_interval 0

# 隐藏客户端装饰 yes no titlebar-only titlebar-and-corners
hide_window_decorations no
# 启用窗口布局 splits,stack,fat,tall,grid
enabled_layouts splits

font_size 16.5
font_family      SauceCodePro Nerd Font Mono
bold_font        SauceCodePro NFMd Font Mono
italic_font      SauceCodePro NFMd Font Mono
bold_italic_font SauceCodePro NFMd Font Mono
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF,U+3000-U+303F,U+2E80-U+2EFF,U+2F00-U+2FDF LXGW WenKai Mono
# 日文
#symbol_map U+3040-U+309F,U+30A0-U+30FF,U+31F0-U+31FF,U+1B000-U+1B0FF,U+1B100-U+1B12F Maple Mono Normal NL CN

# 光标动画
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
confirm_os_window_close 0

# 不要响铃
enable_audio_bell no
scrollback_lines 5000

# window_margin_widget 0
window_padding_width 0 0 0 0

# 不要确认直接关闭
cursor_trail_color none
# 不要记住窗口大小
remember_window_size no
initial_window_width 1200
initial_window_height 760
# 放大窗口用滚动缓冲区的线条填充新空间
scrollback_fill_enlarged_window no
# 鼠标滚轮滚动的行数
wheel_scroll_multiplier 5.0
wheel_scroll_min_lines 1
# 控制滚动条显示的时间
scrollbar never
# 键入隐藏光标 在Wayland上貌似是有bug
mouse_hide_wait -1
# 当窗口大小不是单元格大小的整数倍时 如何分配填充物
placement_strategy top-left
# 复制到剪贴板时，去除行尾的空格
strip_trailing_spaces never

tab_bar_edge top
tab_bar_margin_width      0
tab_bar_margin_height     0 0
tab_bar_style             separator
tab_bar_min_tabs          2
tab_separator             ""
tab_bar_background   #24273a
tab_bar_margin_color none

